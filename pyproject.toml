[project]
name = "gpubench"
version = "0.4.0"
description = "Benchmark open-source LLMs on GPUs with vLLM: performance, capacity and accuracy."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "typer>=0.12",
    "httpx>=0.27",
    "huggingface-hub>=0.24",
]

[project.optional-dependencies]
# Installed only on the GPU VM: runs accuracy evals against the vLLM server.
eval = ["lm-eval[api,ifeval,math]==0.4.13"]
# Maintainers only: build prompt datasets (gpubench prompts make-toolcall). CPU, no torch.
prompts = ["tokenizers>=0.21", "jinja2>=3.1", "pyarrow>=17"]

[project.scripts]
gpubench = "gpubench.cli:app"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument", "pathlib.Path", "pathlib.Path.home"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Editable-install .pth files get the macOS "hidden" flag under ~/Desktop and Python skips them.
pythonpath = ["."]
