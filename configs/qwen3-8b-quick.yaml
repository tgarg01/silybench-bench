# A cheaper Qwen3-8B campaign (~1.5 h on one H100): capacity for the three most common request
# shapes, one repeat per point, no accuracy suite. Good for adding a new GPU or provider.
# Published as its own campaign, next to (never merged with) the full `qwen3-8b` runs.
name: qwen3-8b-quick
parallelism: {tp: 1, pp: 1, dp: 1, ep: 1}
engine:
  image: vllm/vllm-openai:v0.30.0
models:
  - hf_id: Qwen/Qwen3-8B
    precisions: [bf16, fp8]
    max_model_len: 16384
    thinking: false
    serving_args:
      reasoning-parser: qwen3
      default-chat-template-kwargs: {enable_thinking: false}
perf:
  workloads:
    - {name: chat-128-128, input_len: 128, output_len: 128}
    - {name: prefill-1024-128, input_len: 1024, output_len: 128}
    - {name: balanced-2048-2048, input_len: 2048, output_len: 2048}
  concurrency: [1, 16, 64, 256]
  repeats: 1
  slo:
    ttft_p99_ms: 2000
    itl_median_ms: 50
accuracy:
  enabled: false
