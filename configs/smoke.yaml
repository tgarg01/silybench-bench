# ~15 min end-to-end pipeline check. Never published (the data repo rejects campaign "smoke").
name: smoke
engine:
  image: vllm/vllm-openai:v0.30.0
models:
  - hf_id: Qwen/Qwen3-8B
    precisions: [bf16]
    max_model_len: 8192
    serving_args:
      reasoning-parser: qwen3
      default-chat-template-kwargs: {enable_thinking: false}
perf:
  workloads:
    - {name: chat-128-128, input_len: 128, output_len: 128}
  concurrency: [1, 16]
  repeats: 1
  min_prompts: 32
  capacity: {enabled: false}
accuracy:
  tasks:
    - {name: gsm8k, limit: 50}
