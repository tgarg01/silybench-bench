name: qwen3-14b
parallelism: {tp: 1, pp: 1, dp: 1, ep: 1}
engine:
  image: vllm/vllm-openai:v0.30.0
models:
  - hf_id: Qwen/Qwen3-14B
    precisions: [bf16, fp8]
    max_model_len: 16384
    thinking: false
    serving_args:
      reasoning-parser: qwen3
      default-chat-template-kwargs: {enable_thinking: false}
perf:
  workloads:
    - {name: chat-128-128, input_len: 128, output_len: 128}
    - {name: prefill-1024-128, input_len: 1024, output_len: 128}
    - {name: decode-128-1024, input_len: 128, output_len: 1024}
    - {name: balanced-2048-2048, input_len: 2048, output_len: 2048}
    - {name: longctx-8192-512, input_len: 8192, output_len: 512}
  concurrency: [1, 4, 16, 32, 64, 128, 256, 512]
  repeats: 3
  slo:
    ttft_p99_ms: 2000
    itl_median_ms: 50
accuracy:
  tasks:
    - {name: mmlu_pro}
    - {name: gpqa_diamond_cot_zeroshot}  # gated dataset: HF token must have accepted its terms
    - {name: gsm8k}
    - {name: minerva_math500}
    - {name: ifeval}
    - {name: arc_challenge_chat}
