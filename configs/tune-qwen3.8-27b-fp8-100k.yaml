# Optimization screening for the FP8 deployment of experiment 2026-10-qwen3.8-27b-h100,
# on the same worst-case workload (every request a fresh 100k-token tool-calling context).
# Each variant is one serving flag change on top of the published FP8 flags; `base` re-measures
# the published configuration with the same (finer) method. Winners are combined and measured
# with the full method in configs/qwen3.8-27b-h100-fp8-tuned.yaml.
# Screening method: every level 1-6 users, 2 repeats, >= 8 prompts per level, quality on 30 + 30
# items vs `base` (gpubench variants report).
name: tune-qwen3.8-27b-fp8-100k
parallelism: {tp: 1, pp: 1, dp: 1, ep: 1}
engine:
  image: vllm/vllm-openai:v0.30.0
models:
  - hf_id: Qwen/Qwen3.8-27B
    checkpoints: {fp8: Qwen/Qwen3.8-27B-FP8}
    precisions: []  # only the variants below
    max_model_len: 131072
    thinking: true
    serving_args:
      language-model-only: true
      no-enable-prefix-caching: true
      reasoning-parser: qwen3
      enable-auto-tool-choice: true
      tool-call-parser: qwen3_xml
    precision_serving_args:
      fp8: {max-num-seqs: 768}
    variants:
      base:
        precision: fp8
        description: the published FP8 configuration
      chunk16k:
        precision: fp8
        serving_args: {max-num-batched-tokens: 16384}
        description: prefill in 16k-token chunks (default 8k)
      chunk32k:
        precision: fp8
        serving_args: {max-num-batched-tokens: 32768}
        description: prefill in 32k-token chunks
      chunk64k:
        precision: fp8
        serving_args: {max-num-batched-tokens: 65536}
        description: prefill in 64k-token chunks
      kvfp8:
        precision: fp8
        serving_args: {kv-cache-dtype: fp8}
        description: FP8 KV cache (FP8 attention); lossy, quality-gated
      gdn-triton:
        precision: fp8
        serving_args: {gdn-prefill-backend: triton}
        description: Triton kernel for the linear-attention (GDN) prefill (default FlashInfer)
      async:
        precision: fp8
        serving_args: {async-scheduling: true}
        description: overlap CPU scheduling with GPU work
      mtp2:
        precision: fp8
        serving_args:
          speculative-config: {method: mtp, num_speculative_tokens: 2}
          max-num-seqs: 256
        description: MTP speculative decoding, 2 draft tokens (lossless by design)
perf:
  workloads:
    - name: toolcall-100k-512
      dataset: custom
      input_len: 100000
      output_len: 512
      dataset_path: datasets/toolcall-100k.jsonl
      dataset_url: https://github.com/tgarg01/silybench-data/releases/download/exp-2026-10-qwen3.8-27b-h100/toolcall-100k.jsonl
      sha256: c35ce2d6c4eb9c5bffe80544042d0555dd0d8293924baffe6de142f09531083b
      concurrency: [1, 2, 3, 4, 5, 6]
      min_prompts: 8
      num_warmups: 1
      slo: {ttft_p99_ms: 30000, itl_median_ms: 50}
      # Correctness (the perf run forces 512 output tokens, so it can't tell): 100 exact-answer
      # recall questions about tool outputs deep in the context + 100 drift decision points.
      quality:
        dataset_path: datasets/toolcall-100k-quality.jsonl
        dataset_url: https://github.com/tgarg01/silybench-data/releases/download/exp-2026-10-qwen3.8-27b-h100/toolcall-100k-quality.jsonl
        sha256: 2cf0a857ef5f9f37a5430dc683e4853a14084c308322620b8401ad3e62e7df3f
        limit: 30  # screening: 30 recall + 30 drift items per variant
  prompts_per_user: 2
  repeats: 2
  slo:
    ttft_p99_ms: 2000
    itl_median_ms: 50
accuracy:
  enabled: false
profiles:
  - {precision: fp8, variant: base, workload: toolcall-100k-512, concurrency: 1, output_len: 1}
